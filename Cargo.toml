[workspace]
members = [
    "crates/islands-reactor",
    "crates/tools/islands-reactor-codegen",
    "samples/*",
]
resolver = "3"
exclude = ["reference/windows-rs"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
windows = { version = "0.100.0", path = "reference/windows-rs/crates/libs/windows", default-features = false }
windows-bindgen = { version = "0.100.0", path = "reference/windows-rs/crates/libs/bindgen", default-features = false }
windows-collections = { version = "0.100.0", path = "reference/windows-rs/crates/libs/collections", default-features = false }
windows-core = { version = "0.100.0", path = "reference/windows-rs/crates/libs/core", default-features = false }
windows-future = { version = "0.100.0", path = "reference/windows-rs/crates/libs/future", default-features = false }
windows-metadata = { version = "0.100.0", path = "reference/windows-rs/crates/libs/metadata", default-features = false }
windows-numerics = { version = "0.100.0", path = "reference/windows-rs/crates/libs/numerics", default-features = false }
windows-reference = { version = "0.100.0", path = "reference/windows-rs/crates/libs/reference", default-features = false }
windows-threading = { version = "0.100.0", path = "reference/windows-rs/crates/libs/threading", default-features = false }
windows-time = { version = "0.100.0", path = "reference/windows-rs/crates/libs/time", default-features = false }
